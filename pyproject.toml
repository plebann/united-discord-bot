[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "united-discord-bot"
version = "0.1.0"
description = "Discord typer for Manchester United matches"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3,<3",
    "pydantic>=2.0,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.19,<1",
    "alembic>=1.12,<2",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
